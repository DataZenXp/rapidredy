<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RapidRedy | Digital Agency</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ['Space Grotesk', 'sans-serif'],
              body: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              'toon-bg': '#F3F4F6', // Light gray background
              'toon-dark': '#0F172A', // Navy/Black
              'toon-purple': '#8B5CF6', // Vivid Purple
              'toon-yellow': '#FACC15', // Vivid Yellow
              'toon-pink': '#EC4899', // Pink
              'toon-blue': '#3B82F6', // Royal Blue
              'toon-green': '#10B981', // Emerald
              'toon-orange': '#F97316', // Orange
            },
            boxShadow: {
              'hard': '4px 4px 0px 0px #0F172A',
              'hard-sm': '2px 2px 0px 0px #0F172A',
              'hard-lg': '8px 8px 0px 0px #0F172A',
              'hard-xl': '12px 12px 0px 0px #0F172A',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F3F4F6;
        background-image: 
          linear-gradient(#E5E7EB 1px, transparent 1px),
          linear-gradient(90deg, #E5E7EB 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: 0 0;
        background-attachment: fixed;
      }
      
      /* Noise Overlay */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        z-index: 9999;
      }

      /* Custom Selection */
      ::selection {
        background: #0F172A;
        color: #FACC15;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 14px;
      }
      ::-webkit-scrollbar-track {
        background: #F3F4F6;
        border-left: 2px solid #0F172A;
      }
      ::-webkit-scrollbar-thumb {
        background: #3B82F6;
        border: 2px solid #0F172A;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.26",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.557.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
